# Local monitoring stack — Grafana, Prometheus, Loki, Alloy, cAdvisor and a
# silent Alertmanager, watching the LOCAL Docker projects of the apps that run on
# Dennis: mAgenticX (`magenticx`) and, when it is running, OrthodoxAI
# (`orthodoxai`). Each gets its own Grafana folder. Nothing here joins either
# project's networks — logs come from the Docker socket, metrics from cAdvisor.
#
# The Dennis twin is docker-compose-denis.yml (Swarm, TLS, NPM, e-mail alerts).
# This file reuses its dashboards, Grafana provisioning, Loki config and alert
# rules unchanged; only target discovery differs (local/), because local
# containers carry Compose labels instead of Swarm ones.
#
# Runs as its OWN project (`name: monitoring` below), so it can never recreate
# an app container. From this folder:
#
#   docker compose up -d
#
# Grafana: http://localhost:3000 — user `admin`, password in
# secrets/grafana_admin_password (gitignored; see README.md for how to create
# it). Bound to 127.0.0.1 only: nothing here is reachable from the network.
# Plain HTTP locally — the Grafana TLS material in tls/ is for Dennis only.
#
# The log panels parse JSON: set LOG_FORMAT=json in magenticx/magenticx/.env and
# recreate the three app services to fill them (metrics panels work either way).
# The OrthodoxAI local compose logs in console format, so locally only its
# raw-log panels fill; on Dennis it logs JSON and every panel works.

name: monitoring

services:
  grafana:
    image: grafana/grafana:12.4.14   # same as Denis
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Base of the "Open in Langfuse" links (datasources.yml): the local
      # Langfuse from ../langfuse, when it runs.
      - LANGFUSE_URL=http://localhost:3300
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/monitoring.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/monitoring.yml:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.13.5   # same as Denis
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--log.level=error"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"   # Denis keeps 90d; a laptop doesn't need it
      - "--web.enable-lifecycle"
      - "--web.enable-otlp-receiver"          # see docker-compose-denis.yml
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - prometheus-data:/prometheus
      - ./local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    restart: unless-stopped
    networks:
      - monitoring

  # Per-container CPU / memory / network / restarts — what the dashboards chart.
  # v0.60.6 identifies containers with Docker Desktop's containerd image store
  # (Storage Driver: overlayfs) too; v0.47 to v0.52 reported only the machine.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6   # same as Denis
    command: ["-logtostderr", "-docker_only"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    networks:
      - monitoring

  # Receives Prometheus and Loki alerts so the rules evaluate end-to-end, and
  # sends them nowhere: a laptop must never e-mail production alert recipients.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=warn"
    volumes:
      - alertmanager-data:/alertmanager
      - ./local/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - loki-data:/loki
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki-rules.yml:/etc/loki/rules/fake/rules.yml:ro
    restart: unless-stopped
    networks:
      - monitoring

  # Ships the app containers' Docker logs to Loki (read-only Docker API access).
  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345   # scraped as job alloy (not published)
    user: root   # to read the Docker socket
    environment:
      - LANGFUSE_PROJECT_MAGENTICX=magenticx
      - LANGFUSE_PROJECT_ORTHODOXAI=orthodoxai
    volumes:
      - ./local/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring

  # Traces (tempo-config.yml), fed only by alloy-otlp.
  tempo:
    image: grafana/tempo:2.10.10   # same as Dennis
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - tempo-data:/var/tempo
      - ./tempo-config.yml:/etc/tempo/tempo.yml:ro
    restart: unless-stopped
    networks:
      - monitoring

  # The OTLP collector (alloy-otlp.alloy), as on Dennis: not root, no Docker
  # socket, the only service on the `observability` network the apps join.
  # Needs the three gitignored secrets/otlp_* files (README.md § OTLP secrets).
  alloy-otlp:
    image: grafana/alloy:v1.20.1   # same as Dennis
    command:
      - run
      - /etc/alloy/otlp.alloy
      - --storage.path=/tmp/alloy-otlp
    user: "65534:65534"
    volumes:
      - ./alloy-otlp.alloy:/etc/alloy/otlp.alloy:ro
    secrets:
      - otlp_bearer_token
      - otlp_tls_crt
      - otlp_tls_key
    depends_on:
      - tempo
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - monitoring
      - observability

volumes:
  tempo-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:

networks:
  monitoring:
  # Fixed name, so app projects can join it as `external` (Phase B).
  observability:
    name: observability

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  otlp_bearer_token:
    file: ./secrets/otlp_bearer_token
  otlp_tls_crt:
    file: ./secrets/otlp_tls.crt
  otlp_tls_key:
    file: ./secrets/otlp_tls.key
