# Tempo (single binary, local storage) for the Dennis monitoring stack.
# Receives traces ONLY from alloy-otlp over the monitoring `net` (OTLP gRPC,
# no auth inside the overlay): the apps never reach Tempo directly. Baked into
# the monitoring_tempo image (bind-mounted locally) at /etc/tempo/tempo.yml.
#
# RED metrics and the service graph are NOT generated here: alloy-otlp derives
# them from 100% of spans before tail sampling, so Tempo's metrics-generator
# (which would only see the sampled traces) stays off.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9096
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 720h   # plan: traces 30d

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
