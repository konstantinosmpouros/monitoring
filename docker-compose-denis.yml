# Dennis monitoring stack — Grafana, Prometheus, cAdvisor, node-exporter,
# Alertmanager, Loki and Alloy, watching every app stack on the shared VM
# (today mAgenticX `magenticx` and OrthodoxAI `orthodoxai`).
#
# Deployed by Portainer as the Swarm stack `monitoring` (its service,
# volume and network names derive from that stack name — keep it, or Grafana /
# Prometheus / Loki history is orphaned in the old volumes). Portainer pulls
# THIS file from this repo.
#
# Every config is baked into a `monitoring_*` image (images/<service>/
# Dockerfile). RELEASE = bump the shared tag below (patch digit); CD builds the
# images that tag doesn't exist for yet, pushes them to GHCR (private) and calls
# the Portainer webhook. All five monitoring_* images always carry ONE tag.
# Only the Grafana TLS pair stays on the host, in /opt/monitoring/tls/.
#
# GRAFANA_USER is a Portainer stack environment variable. The two secrets are
# created once by hand: `monitoring_grafana_admin_password` and
# `monitoring_alert_smtp_password`. See CLAUDE.md § Dennis.

version: "3.8"

services:
  grafana:
    image: ghcr.io/konstantinosmpouros/monitoring_grafana:v0.1.0
    # No host port — Grafana is reachable ONLY through NPM over the `proxy`
    # network (monitoring.magenticx.com). Publishing :3000 would expose it on the
    # VM's IP in plaintext, bypassing NPM's HTTPS + access control.
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      - type: bind
        source: /opt/monitoring/tls/tls.crt
        target: /etc/grafana/tls/tls.crt
        read_only: true
      - type: bind
        source: /opt/monitoring/tls/tls.key
        target: /etc/grafana/tls/tls.key
        read_only: true
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/tls/tls.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/tls/tls.key
      - GF_SERVER_ROOT_URL=https://monitoring.magenticx.com
    secrets:
      - grafana_admin_password
    networks:
      - net
      - proxy

  prometheus:
    image: ghcr.io/konstantinosmpouros/monitoring_prometheus:v0.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=error'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=8GB'
      - '--web.enable-lifecycle'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: prometheus-data
        target: /prometheus
    networks:
      - net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    command: -logtostderr -docker_only
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    networks:
      - net

  node-exporter:
    image: prom/node-exporter:v1.5.0
    command:
      - '--path.sysfs=/host/sys'
      - '--path.procfs=/host/proc'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
      - '--no-collector.ipvs'
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    networks:
      - net

  alertmanager:
    image: ghcr.io/konstantinosmpouros/monitoring_alertmanager:v0.1.0
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--log.level=warn'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    secrets:
      - alert_smtp_password
    volumes:
      - type: volume
        source: alertmanager-data
        target: /alertmanager
    networks:
      - net

  loki:
    image: ghcr.io/konstantinosmpouros/monitoring_loki:v0.1.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: loki-data
        target: /loki
    networks:
      - net

  alloy:
    image: ghcr.io/konstantinosmpouros/monitoring_alloy:v0.1.0
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    user: root
    deploy:
      mode: global
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: volume
        source: alloy-data
        target: /var/lib/alloy/data
    networks:
      - net

volumes:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:

networks:
  net:
    driver: overlay
  proxy:
    external: True

secrets:
  alert_smtp_password:
    external: true
    name: monitoring_alert_smtp_password
  grafana_admin_password:
    external: true
    name: monitoring_grafana_admin_password
