# Dennis monitoring stack — Grafana, Prometheus, cAdvisor, node-exporter,
# Alertmanager, Loki, Tempo, Alloy (Docker logs) and alloy-otlp (the OTLP
# collector), watching everything on the shared VM: the Swarm stacks mAgenticX
# `magenticx` and OrthodoxAI `orthodoxai`, and the plain Compose projects
# `sandbox` and `mcp_gateway`.
#
# Deployed by Portainer as the Swarm stack `monitoring` (its service,
# volume and network names derive from that stack name — keep it, or Grafana /
# Prometheus / Loki history is orphaned in the old volumes). Portainer pulls
# THIS file from this repo.
#
# Every config is baked into a `monitoring_*` image (images/<service>/
# Dockerfile). RELEASE = bump the shared tag below (patch digit); CD builds the
# images that tag doesn't exist for yet, pushes them to GHCR (private) and calls
# the Portainer webhook. All six monitoring_* images always carry ONE tag.
# Only the Grafana TLS pair stays on the host, in /opt/monitoring/tls/.
#
# No stack environment variables. The six Swarm secrets are created once by
# hand: `monitoring_grafana_admin_user`, `monitoring_grafana_admin_password`,
# `monitoring_alert_smtp_password` and the three `monitoring_otlp_*`. See CLAUDE.md § Dennis.

version: "3.8"

services:
  grafana:
    image: ghcr.io/konstantinosmpouros/monitoring_grafana:v0.1.1
    # No host port — Grafana is reachable ONLY through NPM over the `proxy`
    # network (monitoring.magenticx.com). Publishing :3000 would expose it on the
    # VM's IP in plaintext, bypassing NPM's HTTPS + access control.
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      - type: bind
        source: /opt/monitoring/tls/tls.crt
        target: /etc/grafana/tls/tls.crt
        read_only: true
      - type: bind
        source: /opt/monitoring/tls/tls.key
        target: /etc/grafana/tls/tls.key
        read_only: true
    environment:
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/tls/tls.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/tls/tls.key
      - GF_SERVER_ROOT_URL=https://monitoring.magenticx.com
      # Base of the "Open in Langfuse" links on log lines (datasources.yml).
      - LANGFUSE_URL=https://langfuse.magenticx.com
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    networks:
      - net
      - proxy

  prometheus:
    image: ghcr.io/konstantinosmpouros/monitoring_prometheus:v0.1.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=error'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=8GB'
      - '--web.enable-lifecycle'
      # alloy-otlp pushes here: app + span metrics over OTLP, its own metrics
      # over remote write. Only the monitoring `net` reaches Prometheus.
      - '--web.enable-otlp-receiver'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: prometheus-data
        target: /prometheus
    networks:
      - net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command: -logtostderr -docker_only
    deploy:
      mode: global
      resources:
        limits:
          # v0.60 peaks around 106 MB on its first pass over the host's
          # containers (~57 MB steady): 128M was too tight to be safe.
          memory: 256M
        reservations:
          memory: 64M
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    networks:
      - net

  node-exporter:
    image: prom/node-exporter:v1.12.1
    # --path.rootfs: the host `/` is bind-mounted at /rootfs, so filesystem
    # metrics (disk-space alert) describe the host disks, not this container's.
    command:
      - '--path.sysfs=/host/sys'
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--no-collector.ipvs'
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    networks:
      - net

  alertmanager:
    image: ghcr.io/konstantinosmpouros/monitoring_alertmanager:v0.1.1
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--log.level=warn'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    secrets:
      - alert_smtp_password
    volumes:
      - type: volume
        source: alertmanager-data
        target: /alertmanager
    networks:
      - net

  loki:
    image: ghcr.io/konstantinosmpouros/monitoring_loki:v0.1.1
    command: ["-config.file=/etc/loki/loki-config.yml"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: loki-data
        target: /loki
    networks:
      - net

  alloy:
    image: ghcr.io/konstantinosmpouros/monitoring_alloy:v0.1.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # Prometheus scrapes /metrics over the monitoring `net` (job alloy).
      - --server.http.listen-addr=0.0.0.0:12345
    user: root
    deploy:
      mode: global
    environment:
      # Langfuse project ids for the "Open in Langfuse" links (Langfuse →
      # project Settings). Not secrets.
      - LANGFUSE_PROJECT_MAGENTICX=magenticx
      - LANGFUSE_PROJECT_ORTHODOXAI=orthodoxai
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: volume
        source: alloy-data
        target: /var/lib/alloy/data
    networks:
      - net

  # Traces. Fed only by alloy-otlp over `net`; Grafana queries it.
  tempo:
    image: ghcr.io/konstantinosmpouros/monitoring_tempo:v0.1.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    volumes:
      - type: volume
        source: tempo-data
        target: /var/tempo
    networks:
      - net

  # The OTLP collector (alloy-otlp.alloy): the ONLY monitoring service on the
  # neutral `observability` overlay the apps join to push telemetry. Same image
  # as `alloy`, its own config; no Docker socket, not root, HTTP server on
  # 127.0.0.1 (its metrics are remote-written). OTLP needs TLS + a bearer token.
  alloy-otlp:
    image: ghcr.io/konstantinosmpouros/monitoring_alloy:v0.1.1
    command:
      - run
      - /etc/alloy/otlp.alloy
      - --storage.path=/tmp/alloy-otlp
    user: "65534:65534"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 96M
    secrets:
      - source: otlp_bearer_token
        target: otlp_bearer_token
        uid: "65534"
        gid: "65534"
        mode: 0400
      - source: otlp_tls_crt
        target: otlp_tls_crt
        uid: "65534"
        gid: "65534"
        mode: 0444
      - source: otlp_tls_key
        target: otlp_tls_key
        uid: "65534"
        gid: "65534"
        mode: 0400
    networks:
      - net
      - observability

volumes:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  tempo-data:

networks:
  net:
    driver: overlay
  proxy:
    external: True
  # Neutral, attachable overlay created once by hand (CLAUDE.md § One-time
  # setup). Apps join it to push OTLP to alloy-otlp; nothing else of this stack
  # is on it, and this stack joins no app network.
  observability:
    external: true
    name: observability

secrets:
  alert_smtp_password:
    external: true
    name: monitoring_alert_smtp_password
  grafana_admin_user:
    external: true
    name: monitoring_grafana_admin_user
  grafana_admin_password:
    external: true
    name: monitoring_grafana_admin_password
  otlp_bearer_token:
    external: true
    name: monitoring_otlp_bearer_token
  otlp_tls_crt:
    external: true
    name: monitoring_otlp_tls_crt
  otlp_tls_key:
    external: true
    name: monitoring_otlp_tls_key
