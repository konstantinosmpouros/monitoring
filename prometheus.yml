# Prometheus config for the Dennis monitoring stack.
# Source of truth — deployed by bind-mounting this file to
# /etc/prometheus/prometheus.yml (see docker-compose-denis.yml).
# After editing, reload without a restart: POST http://prometheus:9090/-/reload
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Names the Prometheus, not a project: external labels are stamped on every
  # alert sent to Alertmanager, and this instance alerts on BOTH app stacks
  # (magenticx and orthodoxai). A `stack: magenticx` label here would mislabel
  # every OrthodoxAI alert e-mail. Per-project alerts carry their own `project`
  # label (alert.rules.yml).
  external_labels:
    monitor: dennis

# OTLP metrics pushed by alloy-otlp (--web.enable-otlp-receiver): the apps' own
# metrics (Phase B) and the span metrics / service graph alloy-otlp derives from
# every trace BEFORE tail sampling. These resource attributes become labels; all
# are low-cardinality by construction (never user/session/request ids).
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ["tasks.alertmanager"]
          type: A
          port: 9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container metrics (CPU, memory, restarts) incl. Swarm service labels.
  - job_name: cadvisor
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080
    # sandbox and mcp_gateway run as plain Compose projects (they need
    # `privileged`, which Swarm ignores), so their containers carry Compose
    # labels. Rebuild the Swarm-style labels every dashboard and alert filters
    # on — `<project>_<service>` and the stack namespace — for those two only.
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project, container_label_com_docker_compose_service]
        regex: "(sandbox|mcp_gateway);(.+)"
        target_label: container_label_com_docker_swarm_service_name
        replacement: "${1}_${2}"
      - source_labels: [container_label_com_docker_compose_project]
        regex: "(sandbox|mcp_gateway)"
        target_label: container_label_com_docker_stack_namespace
        replacement: "${1}"

  # Host metrics (CPU, memory, disk, filesystem).
  - job_name: node-exporter
    dns_sd_configs:
      - names: ["tasks.node-exporter"]
        type: A
        port: 9100

  - job_name: alertmanager
    dns_sd_configs:
      - names: ["tasks.alertmanager"]
        type: A
        port: 9093

  # The rest of the pipeline, so TargetDown also covers monitoring's own blind
  # spots. alloy-otlp is NOT scraped: it sits on the `observability` network
  # with the apps, so its HTTP server (UI + /metrics) stays on 127.0.0.1 and it
  # remote-writes its own metrics instead (job="alloy-otlp", AlloyOtlpMissing).
  - job_name: alloy
    dns_sd_configs:
      - names: ["tasks.alloy"]
        type: A
        port: 12345

  - job_name: loki
    dns_sd_configs:
      - names: ["tasks.loki"]
        type: A
        port: 3100

  - job_name: tempo
    dns_sd_configs:
      - names: ["tasks.tempo"]
        type: A
        port: 3200

# NOTE: the app services of every stack are intentionally NOT scraped — they sit
# behind mTLS on internal networks this stack does not join. They PUSH: OTLP to
# alloy-otlp over the neutral `observability` network (Phase B), which forwards
# metrics here through the OTLP receiver. cAdvisor already sees every container.
