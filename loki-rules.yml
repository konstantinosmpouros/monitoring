# Loki ruler alert rules (LogQL) — application-level errors from the logs.
# Bind-mounted to /etc/loki/rules/fake/rules.yml; fires into the same
# Alertmanager as the Prometheus rules, so everything emails one place.
#
# Four stacks ship logs here (alloy-config.alloy): magenticx, orthodoxai,
# sandbox and mcp_gateway. The generic rules group `by (stack)` / `by (service)`,
# so one rule covers all of them and the alert e-mail names the stack. Services are named `<stack>_<service>`,
# so a `service` label alone is never ambiguous between the two.
groups:
  - name: application-errors
    rules:
      - alert: HighErrorLogRate
        expr: |
          sum by (stack) (rate({stack=~"magenticx|orthodoxai|sandbox|mcp_gateway", level="ERROR"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated ERROR log rate across {{ $labels.stack }}"
          description: "More than ~1 ERROR log every 5s, sustained for 5m."

      - alert: ServiceErrorBurst
        expr: |
          sum by (stack, service) (count_over_time({stack=~"magenticx|orthodoxai|sandbox|mcp_gateway", level="ERROR"}[5m])) > 10
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Error burst in {{ $labels.service }}"
          description: ">10 ERROR logs in 5m from {{ $labels.service }}."

      - alert: UnhandledException
        expr: |
          sum by (stack, service) (count_over_time({stack=~"magenticx|orthodoxai|sandbox"} |= "unhandled_exception" [5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Unhandled exception in {{ $labels.service }}"
          description: "An unhandled_exception event was logged."

      - alert: AgentRunErrors
        expr: |
          sum by (stack, service) (count_over_time({stack=~"magenticx|orthodoxai", service=~"(magenticx|orthodoxai)_agents"} |= "agent_run_error" [10m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Multiple agent run errors in {{ $labels.service }}"
          description: ">3 agent_run_error events in 10m."

      # The log pipeline itself: no line from ANY watched stack for an hour
      # means Alloy, Loki or the Docker socket mount is broken (the apps log
      # health and access lines all day).
      - alert: LogsStoppedArriving
        expr: |
          absent_over_time({stack=~"magenticx|orthodoxai|sandbox|mcp_gateway"}[1h])
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "No logs from any watched stack for 1h"
          description: "Loki has received nothing from magenticx, orthodoxai, sandbox or mcp_gateway in an hour. Check monitoring_alloy and monitoring_loki."

  # Sandbox runner (plain Compose project `sandbox`): the `sandbox_exec` audit
  # event, one per exec, outcome = completed | refused | unavailable | busy |
  # failed.
  - name: sandbox
    rules:
      - alert: SandboxExecFailures
        expr: |
          sum by (stack) (count_over_time({stack="sandbox"} |= "sandbox_exec" | json | fields_outcome=~"failed|unavailable" [10m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Sandbox execs are failing"
          description: ">3 sandbox_exec events with outcome failed/unavailable in 10m: agent code execution is broken (gVisor box, inner dind or workspace)."

      # Refusals are the runner's policy saying no. A surge means a caller is
      # pushing past the policy (a prompt-injected agent, or a bug).
      - alert: SandboxExecRefusalSurge
        expr: |
          sum by (stack) (count_over_time({stack="sandbox"} |= "sandbox_exec" | json | fields_outcome="refused" [10m])) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Surge of refused sandbox execs"
          description: ">20 refused sandbox_exec events in 10m. See Sandbox / Runner overview for the agent_slug."

  # MCP gateway (plain Compose project `mcp_gateway`, upstream image, text logs).
  - name: mcp-gateway
    rules:
      # The known failure mode: the inner dockerd never comes up and the
      # entrypoint loops on this line; port 8005 never opens. A bare restart
      # does not fix it: recreate from denis/mcp_gateway.
      - alert: McpGatewayDindStuck
        expr: |
          sum by (stack) (count_over_time({stack="mcp_gateway"} |= "Waiting for dockerd" [10m])) > 20
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "MCP gateway stuck waiting for its inner dockerd"
          description: "The dind entrypoint is looping on 'Waiting for dockerd'. Recreate with docker compose -p mcp_gateway -f docker-compose-denis.yaml up -d --force-recreate (a restart is not enough)."

  # OrthodoxAI-only signals — events the magenticx services do not emit.
  - name: orthodoxai-kiosk
    rules:
      # Live voice, push-to-talk and read-aloud all depend on the provider. A
      # kiosk that has stopped speaking produces no error a visitor can report,
      # so the upstream failures are the only way anyone finds out.
      - alert: OrthodoxAIVoiceFailures
        expr: |
          sum by (stack) (count_over_time({stack="orthodoxai", service="orthodoxai_dialogue_bridge"} |~ "realtime_voice_session_(failed|unreachable|invalid_json)|dictation_upstream_(http_error|unreachable)|read_aloud_upstream_(failed|unavailable)" [10m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "OrthodoxAI voice / speech failures"
          description: ">3 voice, dictation or read-aloud upstream failures in 10m — the kiosk may have stopped listening or speaking."

      # The access gate refuses before any provider call, so a surge costs
      # nothing. It still means something is hammering a closed kiosk: a
      # scanner past Cloudflare, or — once device authorization lands — an
      # unregistered or revoked tablet retrying.
      - alert: OrthodoxAIAccessDeniedSurge
        expr: |
          sum by (stack) (count_over_time({stack="orthodoxai", service="orthodoxai_dialogue_bridge"} |= "kiosk_access_denied" [10m])) > 50
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "OrthodoxAI access gate is refusing a surge of requests"
          description: ">50 kiosk_access_denied events in 10m. See the OrthodoxAI — Kiosk access & security dashboard for the (hashed) client."
